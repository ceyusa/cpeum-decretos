name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: .

jobs:
  rstcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv sync --group dev
      - name: rstcheck
        run: uv run rstcheck CPEUM/*.rst

  pyspelling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y aspell aspell-es
      - run: uv sync --group dev
      - name: pyspelling
        run: uv run pyspelling -n ortografia

  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv sync --group dev
      - name: ruff check
        run: uv run ruff check scripts/*.py*
      - name: ruff format
        run: uv run ruff format --check scripts/*.py*

  pylint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv sync --group dev
      - name: pylint
        run: uv run pylint scripts/*.py*

  diccionario:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv sync --group dev
      - name: corregir diccionario
        run: uv run scripts/corregir_diccionario.py
      - name: verificar diccionario sin cambios
        run: git diff --exit-code -- es-local.txt

  reajustar-rst:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv sync --group dev
      - name: reajustar rst
        run: uv run scripts/reajustar_rst.py --ancho 72 CPEUM/*.rst
        continue-on-error: true
      - name: verificar rst sin cambios
        run: git diff --exit-code

  genericos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - name: Install pre-commit
        run: uv tool run pre-commit
      - name: check yaml
        run: uv tool run pre-commit run -a check-yaml
      - name: trailing whitespace
        run: uv tool run pre-commit run -a trailing-whitespace
        continue-on-error: true
      - name: eof fixer
        run: uv tool run pre-commit run -a end-of-file-fixer
        continue-on-error: true
      - name: verificar rst sin cambios
        run: git diff --exit-code
