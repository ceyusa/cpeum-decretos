name: Set up uv environment
description: Instala uv, las dependencias de sistema y sincroniza el grupo dev
inputs:
  extra-apt-packages:
    description: Paquetes apt adicionales
    default: ''
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@v10.0.1
      with:
        enable-cache: true
    - name: Install system dependencies
      run: sudo apt-get install -y libxml2 libxslt1.1 ${{ inputs.extra-apt-packages }}
      shell: bash
    - name: Sync dev environment
      run: uv sync --locked --group dev
      shell: bash
